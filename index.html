
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borshy Browser</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  height: 60px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #101321;
  border-bottom: 1px solid #292d40;
}
.logo {
  color: #a18aff;
  font-size: 23px;
  font-weight: bold;
}
.home {
  text-align: center;
  padding: 30px 15px;
}
h1 { font-size: 48px; margin: 12px 0; }
.subtitle { color: #9296aa; }
.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #151827;
  border-bottom: 1px solid #292d40;
}
button {
  background: #252a3e;
  color: white;
  border: 1px solid #3a405a;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: #5949a7; }
.address {
  flex: 1;
  min-width: 0;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #3a405a;
  background: #090b12;
  color: white;
}
.search {
  display: flex;
  max-width: 650px;
  margin: 25px auto;
  padding: 7px;
  background: #171b2b;
  border: 1px solid #343950;
  border-radius: 12px;
}
.search input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
}
.search button { background: #7964ed; }
.links {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px;
}
.links button { padding: 13px 20px; }
#viewer {
  width: 100%;
  height: calc(100vh - 130px);
  display: none;
  border: none;
  background: white;
}
.note {
  color: #85899d;
  font-size: 13px;
  margin-top: 25px;
}
@media(max-width: 600px) {
  .toolbar { flex-wrap: wrap; }
  .address { flex-basis: 100%; order: 2; }
}
</style>
</head>
<body>

<header>
  <div class="logo">BORSHY</div>
  <button onclick="goHome()">⌂ Home</button>
</header>

<div class="toolbar">
  <button onclick="goBack()">←</button>
  <button onclick="goForward()">→</button>
  <button onclick="refreshPage()">↻</button>
  <input class="address" id="address"
    placeholder="Enter a website address...">
  <button onclick="navigate()">Go</button>
</div>

<section class="home" id="home">
  <h1>Borshy.</h1>
  <p class="subtitle">A fresh way to explore the web.</p>

  <form class="search" id="search">
    <input id="searchInput"
      placeholder="Search or enter a website...">
    <button type="submit">Go</button>
  </form>

  <div class="links">
    <button onclick="openSite('https://www.wikipedia.org')">Wikipedia</button>
    <button onclick="openSite('https://www.youtube.com')">YouTube</button>
    <button onclick="openSite('https://www.google.com')">Google</button>
    <button onclick="openSite('https://www.bing.com')">Bing</button>
  </div>

  <p class="note">Welcome to Borshy Browser.</p>
</section>

<iframe
  id="viewer"
  title="Website viewer"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<script>
let historyList = [];
let historyIndex = -1;

function getUrl(value) {
  value = value.trim();
  if (!value) return null;

  if (/^https?:\/\//i.test(value)) return value;

  if (value.includes(".") && !value.includes(" ")) {
    return "https://" + value;
  }

  return "https://www.google.com/search?q=" +
    encodeURIComponent(value);
}

function openSite(url) {
  const frame = document.getElementById("viewer");
  document.getElementById("home").style.display = "none";
  frame.style.display = "block";
  document.getElementById("address").value = url;

  frame.src = url;
  historyList = historyList.slice(0, historyIndex + 1);
  historyList.push(url);
  historyIndex++;
}

function navigate() {
  const url = getUrl(document.getElementById("address").value);
  if (url) openSite(url);
}

function goBack() {
  if (historyIndex > 0) {
    historyIndex--;
    loadHistory();
  } else {
    goHome();
  }
}

function goForward() {
  if (historyIndex < historyList.length - 1) {
    historyIndex++;
    loadHistory();
  }
}

function loadHistory() {
  const url = historyList[historyIndex];
  document.getElementById("address").value = url;
  document.getElementById("viewer").src = url;
}

function refreshPage() {
  const frame = document.getElementById("viewer");
  if (frame.style.display === "block") {
    frame.src = frame.src;
  } else {
    location.reload();
  }
}

function goHome() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("viewer").src = "about:blank";
  document.getElementById("home").style.display = "block";
  document.getElementById("address").value = "";
}

document.getElementById("search").addEventListener("submit", function(e) {
  e.preventDefault();
  const url = getUrl(document.getElementById("searchInput").value);
  if (url) openSite(url);
});

document.getElementById("address").addEventListener("keydown", function(e) {
  if (e.key === "Enter") navigate();
});
</script>

</body>
</html>
