<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borshy Browser</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 60px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #101321;
  border-bottom: 1px solid #292d40;
}

.logo {
  color: #a18aff;
  font-size: 23px;
  font-weight: bold;
}

.tabs {
  display: flex;
  gap: 7px;
  padding: 8px 12px;
  background: #101321;
  overflow-x: auto;
}

.tab {
  display: flex;
  gap: 10px;
  align-items: center;
  min-width: 110px;
  max-width: 190px;
  padding: 10px;
  border-radius: 8px;
  background: #202438;
  cursor: pointer;
}

.tab.active { background: #5949a7; }

.tab-name {
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.close-tab {
  border: none;
  padding: 2px 5px;
  background: transparent;
}

.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #151827;
  border-bottom: 1px solid #292d40;
}

button {
  background: #252a3e;
  color: white;
  border: 1px solid #3a405a;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover { background: #5949a7; }

.address {
  flex: 1;
  min-width: 0;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #3a405a;
  background: #090b12;
  color: white;
}

.home {
  text-align: center;
  padding: 30px 15px;
}

h1 { font-size: 48px; margin: 12px 0; }

.subtitle { color: #9296aa; }

.search {
  display: flex;
  max-width: 650px;
  margin: 25px auto;
  padding: 7px;
  background: #171b2b;
  border: 1px solid #343950;
  border-radius: 12px;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
}

.search button { background: #7964ed; }

.links {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px;
}

#viewer {
  width: 100%;
  height: calc(100vh - 180px);
  display: none;
  border: none;
  background: white;
}

#searchPage {
  display: none;
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.result {
  padding: 16px;
  margin: 12px 0;
  background: #171b2b;
  border: 1px solid #343950;
  border-radius: 10px;
}

.result a {
  color: #a18aff;
  font-size: 19px;
  text-decoration: none;
}

.result p {
  color: #b9bdcc;
  line-height: 1.5;
}

.note { color: #85899d; }

@media(max-width: 600px) {
  .toolbar { flex-wrap: wrap; }
  .address { flex-basis: 100%; order: 2; }
}
</style>
</head>

<body>

<header>
  <div class="logo">BORSHY</div>
  <button onclick="goHome()">⌂ Home</button>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <button onclick="goBack()">←</button>
  <button onclick="goForward()">→</button>
  <button onclick="refreshPage()">↻</button>

  <input class="address" id="address"
    placeholder="Search or enter a website...">

  <button onclick="navigate()">Go</button>
</div>

<section class="home" id="home">
  <h1>Borshy.</h1>
  <p class="subtitle">A fresh way to explore the web.</p>

  <form class="search" id="search">
    <input id="searchInput"
      placeholder="Search Borshy...">
    <button type="submit">Search</button>
  </form>

  <div class="links">
    <button onclick="openSite('https://www.wikipedia.org')">
      Wikipedia
    </button>
    <button onclick="openSite('https://www.youtube.com')">
      YouTube
    </button>
  </div>

  <p class="note">Welcome to Borshy Browser.</p>
</section>

<section id="searchPage">
  <h2 id="searchHeading">Search results</h2>
  <div id="results"></div>
</section>

<iframe
  id="viewer"
  title="Borshy website viewer"
  allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
  allowfullscreen>
</iframe>

<script>
let tabs = [];
let nextId = 1;
let activeId = null;
let lastFrameUrl = "";

function currentTab() {
  return tabs.find(t => t.id === activeId);
}

function createTab() {
  const tab = {
    id: nextId++,
    history: [{type: "home"}],
    index: 0
  };

  tabs.push(tab);
  activeId = tab.id;
  render();
}

function page() {
  const tab = currentTab();
  return tab ? tab.history[tab.index] : null;
}

function renderTabs() {
  const container = document.getElementById("tabs");
  container.innerHTML = "";

  tabs.forEach(tab => {
    const button = document.createElement("div");
    button.className =
      "tab" + (tab.id === activeId ? " active" : "");

    const name = document.createElement("span");
    name.className = "tab-name";

    const p = tab.history[tab.index];

    name.textContent =
      p.type === "home" ? "New Tab" :
      p.type === "search" ? p.query :
      new URL(p.url).hostname;

    const close = document.createElement("button");
    close.className = "close-tab";
    close.textContent = "×";

    button.onclick = () => {
      activeId = tab.id;
      render();
    };

    close.onclick = e => {
      e.stopPropagation();
      closeTab(tab.id);
    };

    button.appendChild(name);
    button.appendChild(close);
    container.appendChild(button);
  });

  const add = document.createElement("button");
  add.textContent = "+";
  add.onclick = createTab;
  container.appendChild(add);
}

function closeTab(id) {
  tabs = tabs.filter(t => t.id !== id);

  if (!tabs.length) {
    createTab();
    return;
  }

  if (activeId === id) {
    activeId = tabs[tabs.length - 1].id;
  }

  render();
}

function pushPage(p) {
  const tab = currentTab();
  if (!tab) return;

  tab.history = tab.history.slice(0, tab.index + 1);
  tab.history.push(p);
  tab.index++;
  render();
}

function getUrl(value) {
  value = value.trim();
  if (!value) return null;

  if (/^https?:\/\//i.test(value)) return value;

  if (value.includes(".") && !value.includes(" ")) {
    return "https://" + value;
  }

  searchFor(value);
  return null;
}

function openSite(url) {
  const match = url.match(
    /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  );

  if (match) {
    url = "https://www.youtube-nocookie.com/embed/" + match[1];
  }

  pushPage({type: "site", url});
}

async function searchFor(query) {
  query = query.trim();
  if (!query) return;

  const p = {
    type: "search",
    query,
    results: null,
    loading: true
  };

  pushPage(p);

  try {
    const api =
      "https://en.wikipedia.org/w/api.php" +
      "?action=query&list=search&srsearch=" +
      encodeURIComponent(query) +
      "&format=json&origin=*&srlimit=10";

    const response = await fetch(api);

    if (!response.ok) throw new Error("Search failed");

    const data = await response.json();

    p.results = data.query.search;
    p.loading = false;

    if (page() === p) render();
  } catch (error) {
    p.loading = false;
    p.error = "Search couldn't load. Please try again.";
    if (page() === p) render();
  }
}

function showResults(p) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  if (p.loading) {
    results.textContent = "Searching...";
    return;
  }

  if (p.error) {
    results.textContent = p.error;
    return;
  }

  if (!p.results || !p.results.length) {
    results.textContent = "No results found. Try another search.";
    return;
  }

  p.results.forEach(item => {
    const card = document.createElement("div");
    card.className = "result";

    const link = document.createElement("a");
    link.href = "#";
    link.textContent = item.title;

    link.onclick = event => {
      event.preventDefault();
      openSite(
        "https://en.wikipedia.org/wiki/" +
        encodeURIComponent(item.title.replace(/ /g, "_"))
      );
    };

    const description = document.createElement("p");
    description.textContent =
      item.snippet.replace(/<[^>]*>/g, "");

    card.appendChild(link);
    card.appendChild(description);
    results.appendChild(card);
  });
}

function navigate() {
  const value = document.getElementById("address").value;
  getUrl(value);
}

function goBack() {
  const tab = currentTab();
  if (!tab || tab.index <= 0) return;
  tab.index--;
  render();
}

function goForward() {
  const tab = currentTab();
  if (!tab || tab.index >= tab.history.length - 1) return;
  tab.index++;
  render();
}

function refreshPage() {
  const p = page();
  if (!p) return;

  if (p.type === "site") {
    lastFrameUrl = "";
    render();
  } else if (p.type === "search") {
    searchFor(p.query);
  }
}

function goHome() {
  pushPage({type: "home"});
}

function render() {
  renderTabs();

  const p = page();
  const home = document.getElementById("home");
  const searchPage = document.getElementById("searchPage");
  const frame = document.getElementById("viewer");
  const address = document.getElementById("address");

  home.style.display = "none";
  searchPage.style.display = "none";
  frame.style.display = "none";

  if (p.type === "home") {
    home.style.display = "block";
    address.value = "";
  }

  if (p.type === "search") {
    searchPage.style.display = "block";
    address.value = p.query;
    document.getElementById("searchHeading").textContent =
      "Results for: " + p.query;
    showResults(p);
  }

  if (p.type === "site") {
    frame.style.display = "block";
    address.value = p.url;

    if (lastFrameUrl !== p.url) {
      frame.src = p.url;
      lastFrameUrl = p.url;
    }
  }

  if (p.type !== "site" && lastFrameUrl) {
    frame.src = "about:blank";
    lastFrameUrl = "";
  }
}

document.getElementById("search").addEventListener(
  "submit",
  event => {
    event.preventDefault();
    searchFor(document.getElementById("searchInput").value);
  }
);

document.getElementById("address").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") navigate();
  }
);

createTab();
</script>

</body>
</html>
