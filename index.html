<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borshy Browser</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 60px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #101321;
  border-bottom: 1px solid #292d40;
}

.logo {
  color: #a18aff;
  font-size: 23px;
  font-weight: bold;
}

.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #151827;
  border-bottom: 1px solid #292d40;
}

button {
  background: #252a3e;
  color: white;

  padding: 10px 14px;

</head>

<body>

<header>
  <div class="logo">BORSHY</div>
  <button onclick="goHome()">⌂ Home</button>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <button onclick="goBack()">←</button>
  <button onclick="goForward()">→</button>
  <button onclick="refreshPage()">↻</button>

  <input class="address" id="address"
    placeholder="Search DuckDuckGo or enter a website...">

  <button onclick="navigate()">Go</button>
</div>

<section class="home" id="home">
  <h1>Borshy.</h1>
  <p class="subtitle">A fresh way to explore the web.</p>

  <form class="search" id="search">
    <input id="searchInput"
      placeholder="Search DuckDuckGo...">
    <button type="submit">Search</button>
  </form>

  <div class="links">
    <button onclick="openSite('https://www.wikipedia.org')">
      Wikipedia
    </button>

    <button onclick="openSite('https://www.youtube.com')">
      YouTube
    </button>

    <button onclick="openSite('https://duckduckgo.com')">
      DuckDuckGo
    </button>
  </div>

  <p class="note">Welcome to Borshy Browser.</p>
</section>

<iframe
  id="viewer"
  title="Website viewer"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  allowfullscreen>
</iframe>

<script>
let tabs = [];
let nextTabId = 1;
let activeTabId = null;

function currentTab() {
  return tabs.find(tab => tab.id === activeTabId);
}

function createTab() {
  const tab = {
    id: nextTabId++,
    url: null,
    history: [],
    historyIndex: -1
  };

  tabs.push(tab);
  activeTabId = tab.id;
  render();
}

function renderTabs() {
  const container = document.getElementById("tabs");
  container.innerHTML = "";

  tabs.forEach(tab => {
    const button = document.createElement("div");
    button.className =
      "tab" + (tab.id === activeTabId ? " active" : "");

    const name = document.createElement("span");
    name.className = "tab-name";

    if (!tab.url) {
      name.textContent = "New Tab";
    } else {
      try {
        name.textContent = new URL(tab.url).hostname;
      } catch {
        name.textContent = "Website";
      }
    }

    const close = document.createElement("button");
    close.className = "close-tab";
    close.textContent = "×";
    close.title = "Close tab";

    button.onclick = () => {
      activeTabId = tab.id;
      render();
    };

    close.onclick = (event) => {
      event.stopPropagation();
      closeTab(tab.id);
    };

    button.appendChild(name);
    button.appendChild(close);
    container.appendChild(button);
  });

  const add = document.createElement("button");
  add.className = "new-tab";
  add.textContent = "+";
  add.title = "New tab";
  add.onclick = createTab;
  container.appendChild(add);
}

function closeTab(id) {
  tabs = tabs.filter(tab => tab.id !== id);

  if (tabs.length === 0) {
    createTab();
    return;
  }

  if (activeTabId === id) {
    activeTabId = tabs[tabs.length - 1].id;
  }

  render();
}

function getUrl(value) {
  value = value.trim();

  if (!value) return null;

  if (/^https?:\/\//i.test(value)) {
    return value;
  }

  if (value.includes(".") && !value.includes(" ")) {
    return "https://" + value;
  }

  return "https://html.duckduckgo.com/html/?q=" +
    encodeURIComponent(value);
}

function prepareUrl(url) {
  // Turn regular YouTube video links into official embed links.
  const match = url.match(
    /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  );

  if (match) {
    return "https://www.youtube-nocookie.com/embed/" + match[1];
  }

  return url;
}

function openSite(url) {
  const tab = currentTab();
  if (!tab) return;

  url = prepareUrl(url);

  tab.history = tab.history.slice(0, tab.historyIndex + 1);
  tab.history.push(url);
  tab.historyIndex = tab.history.length - 1;
  tab.url = url;

  render();
}

function navigate() {
  const value = document.getElementById("address").value;
  const url = getUrl(value);

  if (url) openSite(url);
}

function searchFor(value) {
  if (!value.trim()) return;

  const url = "https://html.duckduckgo.com/html/?q=" +
    encodeURIComponent(value.trim());

  openSite(url);
}

function goBack() {
  const tab = currentTab();
  if (!tab) return;

  if (tab.historyIndex > 0) {
    tab.historyIndex--;
    tab.url = tab.history[tab.historyIndex];
    render();
  } else {
    goHome();
  }
}

function goForward() {
  const tab = currentTab();
  if (!tab) return;

  if (tab.historyIndex < tab.history.length - 1) {
    tab.historyIndex++;
    tab.url = tab.history[tab.historyIndex];
    render();
  }
}

function refreshPage() {
  const tab = currentTab();
  if (!tab || !tab.url) return;

  const frame = document.getElementById("viewer");
  frame.src = tab.url;
}

function goHome() {
  const tab = currentTab();
  if (!tab) return;

  tab.url = null;
  render();
}

function render() {
  renderTabs();

  const tab = currentTab();
  const home = document.getElementById("home");
  const frame = document.getElementById("viewer");
  const address = document.getElementById("address");

  if (!tab || !tab.url) {
    home.style.display = "block";
    frame.style.display = "none";
    frame.src = "about:blank";
    address.value = "";
  } else {
    home.style.display = "none";
    frame.style.display = "block";
    address.value = tab.url;

    if (frame.src !== new URL(tab.url, location.href).href) {
      frame.src = tab.url;
    }
  }
}

document.getElementById("search").addEventListener(
  "submit",
  function(event) {
    event.preventDefault();
    searchFor(document.getElementById("searchInput").value);
  }
);

document.getElementById("address").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") navigate();
  }
);

// Start Borshy with one blank tab.
createTab();
</script>

</body>
</html>
