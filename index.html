
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borshy</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 25px;
  border-bottom: 1px solid #242638;
  color: #a18aff;
  font-size: 23px;
  font-weight: bold;
}
main {
  max-width: 850px;
  margin: 100px auto;
  padding: 20px;
  text-align: center;
}
h1 { font-size: 58px; margin: 0; }
.subtitle { color: #85899d; }
.toolbar {
  display: flex;
  gap: 8px;
  margin: 30px auto 15px;
  max-width: 700px;
}
.toolbar button, .search button {
  background: #202337;
  border: 1px solid #34384d;
  color: white;
  border-radius: 9px;
  padding: 12px;
  cursor: pointer;
}
.toolbar button:hover, .search button:hover {
  background: #5141a5;
}
.search {
  display: flex;
  gap: 8px;
  background: #171a28;
  padding: 8px;
  border: 1px solid #34384d;
  border-radius: 13px;
  max-width: 700px;
  margin: auto;
}
.search input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
}
.search button {
  background: #7964ed;
  border: none;
  padding: 12px 20px;
}
.links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 35px;
}
.links a {
  background: #171a28;
  border: 1px solid #303348;
  padding: 15px 20px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
}
.links a:hover { border-color: #907cff; }
.note {
  color: #74798e;
  font-size: 12px;
  margin-top: 35px;
}
</style>
</head>
<body>

<header>BORSHY</header>

<main>
  <h1>Borshy.</h1>
  <p class="subtitle">A fresh way to explore the web.</p>

  <div class="toolbar">
    <button onclick="history.back()" title="Back">←</button>
    <button onclick="history.forward()" title="Forward">→</button>
    <button onclick="location.reload()" title="Refresh">↻</button>
    <button onclick="location.href=location.pathname" title="Home">⌂</button>
  </div>

  <form class="search" id="search">
    <input id="address" placeholder="Search or enter a website..." autocomplete="off">
    <button type="submit">Go</button>
  </form>

  <div class="links">
    <a href="https://www.wikipedia.org">Wikipedia</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://www.google.com">Google</a>
    <a href="https://www.bing.com">Bing</a>
  </div>

  <p class="note">Borshy Browser • Your web, your way.</p>
</main>

<script>
document.getElementById("search").addEventListener("submit", function(e) {
  e.preventDefault();
  const value = document.getElementById("address").value.trim();
  if (!value) return;

  let url;
  if (/^https?:\/\//i.test(value)) {
    url = value;
  } else if (value.includes(".") && !value.includes(" ")) {
    url = "https://" + value;
  } else {
    url = "https://www.google.com/search?q=" +
      encodeURIComponent(value);
  }
  window.location.href = url;
});
</script>

</body>
</html>
